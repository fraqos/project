name: DHYRA BROWSER - AUTO BUILD APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dhyra Browser v1.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

          echo "Installing Android SDK packages..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Detect Source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip")

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::Tidak ada ZIP project di root repository."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Ditemukan lebih dari satu ZIP. Sisakan satu ZIP source."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Source ZIP: ${ZIPS[0]}"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/dhyra-source"
          mkdir -p "$SOURCE_DIR"

          unzip -oq "${{ steps.source.outputs.zip }}" -d "$SOURCE_DIR"

          PROJECT_DIR=$(
            find "$SOURCE_DIR" \
              -type f \
              -name "settings.gradle.kts" \
              -printf '%h\n' |
            head -n 1
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Add Missing LazyRow Import
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="app/src/main/java/com/dhyra/browser/MainActivity.kt"

          if [ ! -f "$ACTIVITY" ]; then
            echo "::error::MainActivity.kt tidak ditemukan: $ACTIVITY"
            exit 1
          fi

          if grep -qE '\bLazyRow\b' "$ACTIVITY" &&
             ! grep -q '^import androidx\.compose\.foundation\.lazy\.LazyRow$' "$ACTIVITY"; then
            sed -i \
              '/^package .*$/a import androidx.compose.foundation.lazy.LazyRow' \
              "$ACTIVITY"
            echo "LazyRow import added."
          else
            echo "LazyRow import already present or LazyRow is not used."
          fi

      - name: Validate Project
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::File tidak ditemukan: $FILE"
              exit 1
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Display Build Environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"

          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/dhyra-build.log"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan atau kosong."
            exit 1
          fi

          echo "APK berhasil dibuat."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-ERROR-REPORTS
          path: |
            ${{ runner.temp }}/dhyra-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
