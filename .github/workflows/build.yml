name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ekstrak Arsip ZIP & Cari Root Proyek
        run: |
          mkdir -p extracted_project
          unzip -q *.zip -d extracted_project
          
          PROJECT_DIR=$(find extracted_project -name "build.gradle.kts" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Proyek tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Proyek ditemukan di: $PROJECT_DIR"

      - name: Fix WebView Settings Syntax di MainActivity.kt
        run: |
          MAIN_KT=$(find ${{ env.PROJECT_DIR }} -name "MainActivity.kt" | head -n 1)
          # Memastikan javaScriptEnabled dan domStorageEnabled dipanggil lewat .settings
          sed -i 's/\([^.]\)\.javaScriptEnabled/\1.settings.javaScriptEnabled/g' "$MAIN_KT"
          sed -i 's/\([^.]\)\.domStorageEnabled/\1.settings.domStorageEnabled/g' "$MAIN_KT"
          # Mencegah duplikasi jika sudah ada .settings.settings
          sed -i 's/\.settings\.settings\./.settings./g' "$MAIN_KT"

      - name: Generate Gradle Wrapper (Upgrade to Gradle 8.7)
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 8.7

      - name: Beri izin eksekusi Gradle
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: Build Debug APK
        run: cd ${{ env.PROJECT_DIR }} && ./gradlew assembleDebug

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: dhyra-browser-debug
          path: "**/build/outputs/apk/debug/*.apk"
