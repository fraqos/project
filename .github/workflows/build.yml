
name: DHYRA BROWSER Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dhyra Browser v1.9.0
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 4. Accept Android licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 5. Install Android SDK 35
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 6. Setup Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Extract project ZIP
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching DHYRA Browser source ZIP..."

          preferred_zip="$(
            find . -maxdepth 1 -type f \
              -iname 'DHYRA_BROWSER_v1.9.0*.zip' \
              -print -quit
          )"

          if [ -n "$preferred_zip" ]; then
            source_zip="$preferred_zip"

          elif [ -f settings.gradle.kts ]; then
            echo "Project already exists in repository root."
            source_zip=""

          else
            mapfile -t archives < <(
              find . -maxdepth 1 -type f \
                -iname '*.zip' -print
            )

            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Source ZIP not found or multiple ZIP files detected."
              exit 1
            fi

            source_zip="${archives[0]}"
          fi

          if [ -n "$source_zip" ]; then

            echo "Extracting: $source_zip"

            mkdir -p "$RUNNER_TEMP/dhyra-source"

            unzip -oq "$source_zip" \
              -d "$RUNNER_TEMP/dhyra-source"

            project_dir="$(
              find "$RUNNER_TEMP/dhyra-source" \
                -type f \
                -name settings.gradle.kts \
                -printf '%h\n' | head -n 1
            )"

            if [ -z "$project_dir" ]; then
              echo "::error::Android project not found inside ZIP."
              exit 1
            fi

            cp -a "$project_dir"/. "$GITHUB_WORKSPACE"/

          fi

          echo "Project preparation completed."

      # 8. Validate project files
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/dhyra/browser/MainActivity.kt
            app/src/main/java/com/dhyra/browser/BrowserController.kt
            app/src/main/java/com/dhyra/browser/NoteStore.kt
            app/src/main/java/com/dhyra/browser/BrowserEngineProvider.kt
            app/src/main/java/com/dhyra/browser/BrowserAdaptivePolicy.kt
            app/src/test/java/com/dhyra/browser/BrowserAdaptivePolicyTest.kt
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          grep -q 'versionName = "1.9.0"' app/build.gradle.kts
          grep -q 'versionCode = 13' app/build.gradle.kts

          echo "All project files validated."

      # 9. Restore or generate Gradle Wrapper
      - name: Restore or generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper..."

            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

          test -s gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper is ready."

      # 10. Run unit tests
      - name: Run Unit Tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest

      # 11. Run Android Lint
      - name: Run Android Lint
        run: |
          ./gradlew --no-daemon --stacktrace \
            lintDebug

      # 12. Build APK
      - name: Build DHYRA Browser APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload DHYRA Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.9.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Upload diagnostic reports if failed
      - name: Upload Diagnostic Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.9.0-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
