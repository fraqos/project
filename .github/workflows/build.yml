name: DHYRA BROWSER - Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: JVM checks, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/proguard-rules.pro
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dhyra/browser/MainActivity.kt
          test -f app/src/main/java/com/dhyra/browser/BrowserController.kt
          test -f app/src/test/java/com/dhyra/browser/BrowserAddressResolverTest.kt

      - name: Run standalone core logic checks
        run: ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
