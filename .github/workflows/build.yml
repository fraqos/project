name: DHYRA BROWSER - Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Supports all three upload styles:
      # 1) Gradle project at repository root;
      # 2) project inside one parent folder;
      # 3) source ZIP committed to the repository without extraction.
      - name: Locate Android project source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            local -a found=()
            mapfile -t found < <(
              find "$search_root" -type f -name settings.gradle.kts \
                -not -path '*/.gradle/*' -print0 |
              while IFS= read -r -d '' settings_file; do
                project_dir="${settings_file%/settings.gradle.kts}"
                if [[ -f "$project_dir/gradlew" && -f "$project_dir/app/build.gradle.kts" ]]; then
                  printf '%s\n' "$project_dir"
                fi
              done | sort -u
            )
            if [[ ${#found[@]} -gt 0 ]]; then
              printf '%s\n' "${found[@]}"
            fi
          }

          mapfile -t projects < <(find_project "$GITHUB_WORKSPACE")

          if [[ ${#projects[@]} -eq 0 ]]; then
            mapfile -t source_zips < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' -print | sort)
            for archive in "${source_zips[@]}"; do
              extract_dir="$RUNNER_TEMP/dhyra-source-$RANDOM"
              mkdir -p "$extract_dir"
              unzip -q "$archive" -d "$extract_dir"
              mapfile -t projects < <(find_project "$extract_dir")
              if [[ ${#projects[@]} -gt 0 ]]; then
                echo "Project source extracted from: $archive"
                break
              fi
            done
          fi

          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "Expected exactly one Android project containing settings.gradle.kts, gradlew and app/build.gradle.kts; found ${#projects[@]}." >&2
            echo "Upload the extracted project contents or commit one source ZIP." >&2
            exit 1
          fi

          echo "dir=${projects[0]}" >> "$GITHUB_OUTPUT"
          echo "Android project root: ${projects[0]}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7 and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          chmod +x ./gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/proguard-rules.pro
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dhyra/browser/MainActivity.kt
          test -f app/src/main/java/com/dhyra/browser/BrowserController.kt
          test -f app/src/test/java/com/dhyra/browser/BrowserAddressResolverTest.kt
          ./gradlew --version

      - name: Run core browser logic checks
        run: ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-build-reports
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
