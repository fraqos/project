name: DHYRA BROWSER - Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Core logic checks, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract source dari zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls *.zip | head -n 1)
          echo "Mengekstrak $ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          SRC_FILE=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts -print -quit)
          if [ -z "$SRC_FILE" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam zip"
            exit 1
          fi
          SRC=$(dirname "$SRC_FILE")
          # Jangan timpa workflow di .github dengan versi dari zip
          rm -rf "$SRC/.github"
          cp -a "$SRC/." .
          echo "Source berhasil diekstrak ke root repo:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Validate project structure
        shell: bash
        run: |
          missing=0
          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            gradle/wrapper/gradle-wrapper.properties \
            app/build.gradle.kts \
            app/proguard-rules.pro \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/dhyra/browser/MainActivity.kt \
            app/src/main/java/com/dhyra/browser/BrowserController.kt \
            app/src/test/java/com/dhyra/browser/BrowserAddressResolverTest.kt; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; missing=1; fi
          done
          exit $missing

      - name: Run core logic checks
        run: gradle --no-daemon --stacktrace :app:verifyCoreLogic

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
