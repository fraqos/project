name: DHYRA BROWSER - Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIRS=("$GITHUB_WORKSPACE")
          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -print |
            sort
          )

          for archive in "${ZIP_FILES[@]}"; do
            extract_dir="$RUNNER_TEMP/source-${RANDOM}-${RANDOM}"
            mkdir -p "$extract_dir"
            unzip -q "$archive" -d "$extract_dir"
            SEARCH_DIRS+=("$extract_dir")
            echo "Extracted: $archive"
          done

          declare -a projects=()

          find_project() {
            local search_root="$1"

            find "$search_root" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print0 |
            while IFS= read -r -d '' settings_file; do
              project_dir="$(dirname "$settings_file")"

              if [[ -f "$project_dir/gradlew" ]] &&
                 { [[ -f "$project_dir/app/build.gradle.kts" ]] ||
                   [[ -f "$project_dir/app/build.gradle" ]]; }; then
                printf '%s\n' "$project_dir"
              fi
            done
          }

          for search_dir in "${SEARCH_DIRS[@]}"; do
            while IFS= read -r found_project; do
              [[ -n "$found_project" ]] &&
                projects+=("$found_project")
            done < <(find_project "$search_dir")
          done

          mapfile -t projects < <(
            printf '%s\n' "${projects[@]}" |
            sort -u
          )

          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "Found ${#projects[@]} Android projects." >&2
            printf 'Candidate projects:\n' >&2
            printf '  %s\n' "${projects[@]}" >&2
            echo "Repository must contain exactly one Android project." >&2
            exit 1
          fi

          project_root="${projects[0]}"

          echo "dir=$project_root" >> "$GITHUB_OUTPUT"
          echo "project-root=$project_root" >> "$GITHUB_ENV"
          echo "Detected Android project: $project_root"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-license: true
          accept-android-sdk-package-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Validate project and Gradle wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          ./gradlew --version

      - name: Run core browser logic checks
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic

      - name: Run Android lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-build-reports
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
