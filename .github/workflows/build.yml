
name: DHYRA BROWSER Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dhyra Browser v1.9.0
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          preferred_zip="$(find . -maxdepth 1 -type f \
            -iname 'DHYRA_BROWSER_v1.9.0*.zip' -print -quit)"

          if [ -n "$preferred_zip" ]; then
            source_zip="$preferred_zip"
          elif [ -f settings.gradle.kts ]; then
            echo "Project found in repository root."
            source_zip=""
          else
            mapfile -t archives < <(
              find . -maxdepth 1 -type f -iname '*.zip' -print
            )

            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Expected one source ZIP."
              exit 1
            fi

            source_zip="${archives[0]}"
          fi

          if [ -n "$source_zip" ]; then
            mkdir -p "$RUNNER_TEMP/dhyra-source"
            unzip -oq "$source_zip" -d "$RUNNER_TEMP/dhyra-source"

            project_dir="$(
              find "$RUNNER_TEMP/dhyra-source" \
                -type f -name settings.gradle.kts \
                -printf '%h\n' | head -n 1
            )"

            if [ -z "$project_dir" ]; then
              echo "::error::Android project not found."
              exit 1
            fi

            cp -a "$project_dir"/. "$GITHUB_WORKSPACE"/
          fi

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dhyra/browser/MainActivity.kt
          test -f app/src/main/java/com/dhyra/browser/BrowserController.kt
          test -f app/src/main/java/com/dhyra/browser/NoteStore.kt
          test -f app/src/main/java/com/dhyra/browser/BrowserEngineProvider.kt
          test -f app/src/main/java/com/dhyra/browser/BrowserAdaptivePolicy.kt
          test -f app/src/test/java/com/dhyra/browser/BrowserAdaptivePolicyTest.kt

          grep -q 'versionName = "1.9.0"' app/build.gradle.kts
          grep -q 'versionCode = 13' app/build.gradle.kts

      - name: Restore or generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi

          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Run tests, lint and build APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            lintDebug \
            :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.9.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.9.0-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
            **/build/tmp/kotlin-classes/debug/
          if-no-files-found: ignore
          retention-days: 14
          
