
name: DHYRA BROWSER - AUTO BUILD APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dhyra Browser v1.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK Packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          # Disable pipefail temporarily.
          # This prevents the 'yes' SIGPIPE from failing the step.
          # The exit status of sdkmanager is still checked.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          echo "Installing Android SDK packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      # 5. Detect Source ZIP
      - name: Detect Source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname "*.zip"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::Tidak ada ZIP project di root repository."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Ditemukan lebih dari satu ZIP. Sisakan satu ZIP source."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

          echo "Source ZIP: ${ZIPS[0]}"

      # 6. Extract Android Project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/dhyra-source"

          mkdir -p "$SOURCE_DIR"

          unzip -oq "${{ steps.source.outputs.zip }}" \
            -d "$SOURCE_DIR"

          PROJECT_DIR=$(find "$SOURCE_DIR" \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      # 7. Validate Project Structure
      - name: Validate Project
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::File tidak ditemukan: $FILE"
              exit 1
            fi
          done

          echo "Project structure validation passed."

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. Display Build Environment
      - name: Display Build Environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 10. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p "$RUNNER_TEMP"

          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/dhyra-build.log"

      # 11. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan atau kosong."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Upload Build Reports if Failed
      - name: Upload Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-ERROR-REPORTS
          path: |
            ${{ runner.temp }}/dhyra-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
