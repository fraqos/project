name: DHYRA BROWSER - Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate Android project source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            find "$search_root" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' -print0 |
            while IFS= read -r -d '' settings_file; do
              project_dir="$(dirname "$settings_file")"
              if [[ -f "$project_dir/gradlew" && \
                    ( -f "$project_dir/app/build.gradle.kts" || -f "$project_dir/app/build.gradle" ) ]]; then
                printf '%s\n' "$project_dir"
              fi
            done | sort -u
          }

          mapfile -t projects < <(find_project "$GITHUB_WORKSPACE")

          if [[ ${#projects[@]} -eq 0 ]]; then
            mapfile -t source_zips < <(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -iname '*.zip' -print | sort)
            for archive in "${source_zips[@]}"; do
              extract_dir="$RUNNER_TEMP/dhyra-source-${RANDOM}"
              mkdir -p "$extract_dir"
              unzip -q "$archive" -d "$extract_dir"
              mapfile -t projects < <(find_project "$extract_dir")
              if [[ ${#projects[@]} -gt 0 ]]; then
                echo "Source project extracted from: $archive"
                break
              fi
            done
          fi

          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "Expected exactly one Android project with settings file, gradlew and app Gradle file; found ${#projects[@]}" >&2
            echo "Commit extracted project contents or provide one source ZIP." >&2
            exit 1
          fi

          project_root="${projects[0]}"
          echo "dir=$project_root" >> "$GITHUB_OUTPUT"
          echo "Detected Android project: $project_root"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Validate project and Gradle wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          ./gradlew --version

      - name: Run core browser logic checks
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic

      - name: Run Android lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-BROWSER-v1.4.1-build-reports
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
