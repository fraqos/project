name: DHYRA Browser v2.1.0 Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DHYRA Browser v2.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # FIX: Support DHYRA v2.1.0 ZIP
      - name: Prepare DHYRA project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle.kts ]; then

            mapfile -t ZIPS < <(
              find . -maxdepth 1 -type f \
                -iname 'DHYRA_BROWSER*.zip' \
                -print
            )

            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one DHYRA_BROWSER ZIP."
              echo "Found: ${#ZIPS[@]}"
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/dhyra-source"

            unzip -oq "${ZIPS[0]}" \
              -d "$RUNNER_TEMP/dhyra-source"

            PROJECT_DIR="$(
              find "$RUNNER_TEMP/dhyra-source" \
                -type f \
                -name settings.gradle.kts \
                -printf '%h\n' | head -n 1
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::Android project not found inside ZIP."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/
          fi

          test -s settings.gradle.kts
          test -s app/build.gradle.kts

          echo "DHYRA project prepared successfully."

      - name: Validate DHYRA project
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/dhyra/browser/MainActivity.kt
            app/src/main/java/com/dhyra/browser/BrowserController.kt
          )

          for FILE in "${FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing project file: $FILE"
              exit 1
            fi
          done

          echo "Project validation passed."

      - name: Restore or generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Run Unit Tests
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      - name: Run Android Lint
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            lintDebug

      - name: Build DHYRA Browser Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

          echo "DHYRA APK verification passed."

      - name: Upload DHYRA Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v2.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v2.1.0-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
          
