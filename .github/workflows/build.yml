
name: DHYRA BROWSER - AUTO BUILD APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dhyra Browser v1.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Detect source ZIP
      - name: Detect Source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname "*.zip" \
              ! -name "repository-package.zip"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::Tidak ada file ZIP di root repository."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Terlalu banyak ZIP. Sisakan satu ZIP source project."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "ZIP ditemukan: ${ZIPS[0]}"

      # 6. Extract Android project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dhyra-source"

          unzip -oq "${{ steps.source.outputs.zip }}" \
            -d "$RUNNER_TEMP/dhyra-source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/dhyra-source" \
            -type f -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Project Android tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "Project ditemukan: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      # 7. Validate project
      - name: Validate Project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Semua file utama project ditemukan."

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. Build Debug APK with detailed diagnostics
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/dhyra-build.log"

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak berhasil dibuat."
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Upload build diagnostics if failed
      - name: Upload Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.8.0-ERROR-REPORTS
          path: |
            ${{ runner.temp }}/dhyra-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
