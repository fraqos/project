
name: DHYRA BROWSER Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DHYRA Browser v2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare DHYRA project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'DHYRA_BROWSER_v2.0.0*.zip' \
            -print -quit)"

          if [ -n "$ZIP" ]; then
            mkdir -p "$RUNNER_TEMP/dhyra-source"
            unzip -oq "$ZIP" -d "$RUNNER_TEMP/dhyra-source"

            PROJECT="$(
              find "$RUNNER_TEMP/dhyra-source" \
                -name settings.gradle.kts \
                -printf '%h\n' | head -n 1
            )"

            if [ -z "$PROJECT" ]; then
              echo "::error::Android project not found in ZIP."
              exit 1
            fi

            cp -a "$PROJECT"/. "$GITHUB_WORKSPACE"/
          fi

          test -f settings.gradle.kts
          echo "DHYRA project is ready."

      - name: Validate DHYRA Browser v2.0.0
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/dhyra/browser/MainActivity.kt
            app/src/main/java/com/dhyra/browser/BrowserController.kt
            app/src/main/java/com/dhyra/browser/NoteStore.kt
            app/src/main/java/com/dhyra/browser/BrowserEngineProvider.kt
            app/src/main/java/com/dhyra/browser/BrowserAdaptivePolicy.kt
            app/src/test/java/com/dhyra/browser/BrowserAdaptivePolicyTest.kt
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi
          done

          grep -q 'versionName = "2.0.0"' app/build.gradle.kts || {
            echo "::error::Expected versionName 2.0.0"
            exit 1
          }

          grep -q 'versionCode = 14' app/build.gradle.kts || {
            echo "::error::Expected versionCode 14"
            exit 1
          }

          echo "DHYRA Browser 2.0.0 validation successful."

      - name: Restore or generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Run Unit Tests
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android Lint
        run: |
          ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build DHYRA Browser APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK build successful."

      - name: Upload DHYRA Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v2.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Diagnostic Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v2.0.0-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
          
