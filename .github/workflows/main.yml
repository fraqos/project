name: dhyra Android CI (ZIP auto-build)

on:
  # Build otomatis saat ZIP sumber atau file proyek di root repository berubah.
  # Commit workflow saja tidak memicu build sebelum ZIP tersedia; gunakan Run workflow untuk pengujian manual.
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - 'app/**'
      - 'benchmark/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'scripts/**'
      - 'gradlew'
  # Hindari build ganda pada push + pull_request. PR tidak memicu workflow ini.
  # Build manual tetap tersedia dari tab Actions.
  workflow_dispatch:
    inputs:
      build_release:
        description: Also build a release APK (unsigned unless signing is enabled)
        required: false
        default: false
        type: boolean
      sign_release:
        description: Sign the release APK and AAB using the configured GitHub Secrets
        required: false
        default: false
        type: boolean
      run_macrobenchmark:
        description: Run Macrobenchmark on a self-hosted physical Android 14+ device (requires android-physical runner)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locate source, test, build and package dhyra
    # Pin the hosted image to an LTS runner so SDK/tool defaults do not drift with ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release signing request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
        shell: bash
        env:
          BUILD_RELEASE: ${{ inputs.build_release }}
          DHYRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DHYRA_RELEASE_KEYSTORE_BASE64 }}
          DHYRA_RELEASE_STORE_PASSWORD: ${{ secrets.DHYRA_RELEASE_STORE_PASSWORD }}
          DHYRA_RELEASE_KEY_ALIAS: ${{ secrets.DHYRA_RELEASE_KEY_ALIAS }}
          DHYRA_RELEASE_KEY_PASSWORD: ${{ secrets.DHYRA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_RELEASE" != "true" ]]; then
            echo 'ERROR: sign_release requires build_release=true.' >&2
            exit 1
          fi
          for name in DHYRA_RELEASE_KEYSTORE_BASE64 DHYRA_RELEASE_STORE_PASSWORD DHYRA_RELEASE_KEY_ALIAS DHYRA_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Locate Android project (repository source or project ZIP)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          destination = workspace / ".ci-dhyra-unpacked"
          ignored_scan_dirs = {
              ".git", ".ci-dhyra-unpacked", ".gradle", "build", "dist",
              "node_modules", "__pycache__"
          }

          def is_android_root(path: Path) -> bool:
              settings = (path / "settings.gradle.kts").is_file() or (path / "settings.gradle").is_file()
              app_build = (path / "app" / "build.gradle.kts").is_file() or (path / "app" / "build.gradle").is_file()
              manifest = (path / "app" / "src" / "main" / "AndroidManifest.xml").is_file()
              return settings and app_build and manifest

          def archive_has_android_root(archive: zipfile.ZipFile) -> bool:
              names = {item.filename for item in archive.infolist() if not item.is_dir()}
              settings_names = ("settings.gradle.kts", "settings.gradle")
              for name in names:
                  member = PurePosixPath(name)
                  if member.name not in settings_names:
                      continue
                  prefix = "" if str(member.parent) == "." else member.parent.as_posix().rstrip("/") + "/"
                  if (
                      prefix + "app/src/main/AndroidManifest.xml" in names
                      and (prefix + "app/build.gradle.kts" in names or prefix + "app/build.gradle" in names)
                  ):
                      return True
              return False

          if is_android_root(workspace):
              project_root = workspace
              source_mode = "repository root"
              source_archive = ""
          else:
              archives = []
              malformed_archives = []
              for candidate in sorted(workspace.rglob("*.zip")):
                  if candidate.is_symlink() or not candidate.is_file():
                      continue
                  relative_parts = candidate.relative_to(workspace).parts[:-1]
                  if any(part in ignored_scan_dirs for part in relative_parts):
                      continue
                  try:
                      with zipfile.ZipFile(candidate) as zf:
                          if archive_has_android_root(zf):
                              archives.append(candidate)
                  except (zipfile.BadZipFile, OSError):
                      malformed_archives.append(candidate.relative_to(workspace).as_posix())

              if not archives:
                  details = ""
                  if malformed_archives:
                      details = " Invalid ZIP file(s): " + ", ".join(malformed_archives) + "."
                  sys.exit(
                      "ERROR: No Android Gradle project was found at repository root or in a ZIP. "
                      "Commit the DHYRA project ZIP (not just a GitHub Release attachment) into the repository."
                      + details
                  )
              if len(archives) != 1:
                  names = ", ".join(path.relative_to(workspace).as_posix() for path in archives)
                  sys.exit(
                      "ERROR: More than one Android project ZIP was found: " + names + ". "
                      "Keep only the intended DHYRA source ZIP in the repository, or move old project ZIPs out."
                  )

              archive = archives[0]
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True)

              with zipfile.ZipFile(archive) as zf:
                  entries = zf.infolist()
                  total_uncompressed = sum(item.file_size for item in entries)
                  if total_uncompressed > 600 * 1024 * 1024:
                      sys.exit("ERROR: ZIP expands beyond the 600 MiB CI safety limit.")

                  seen_names = set()
                  for item in entries:
                      name = item.filename
                      member = PurePosixPath(name)
                      if not name or member.is_absolute() or ".." in member.parts or "\\" in name:
                          sys.exit(f"ERROR: Unsafe ZIP entry: {name!r}")
                      if member.parts and member.parts[0].endswith(":"):
                          sys.exit(f"ERROR: Windows absolute ZIP entry is not allowed: {name!r}")
                      if name in seen_names:
                          sys.exit(f"ERROR: Duplicate ZIP entry is not allowed: {name!r}")
                      seen_names.add(name)
                      mode = (item.external_attr >> 16) & 0xFFFF
                      if stat.S_ISLNK(mode):
                          sys.exit(f"ERROR: Symlink entry is not allowed in project ZIP: {name!r}")
                      target = destination.joinpath(*member.parts).resolve()
                      if not target.is_relative_to(destination):
                          sys.exit(f"ERROR: ZIP entry escapes extraction directory: {name!r}")

                  bad_member = zf.testzip()
                  if bad_member:
                      sys.exit(f"ERROR: ZIP integrity check failed at entry: {bad_member}")

                  for item in entries:
                      member = PurePosixPath(item.filename)
                      target = destination.joinpath(*member.parts)
                      if item.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(item, "r") as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

              candidates = []
              for path in destination.rglob("settings.gradle*"):
                  if path.name in ("settings.gradle", "settings.gradle.kts") and is_android_root(path.parent):
                      candidates.append(path.parent)
              if not candidates:
                  sys.exit(
                      "ERROR: ZIP extracted, but no Android Gradle project was found. "
                      "The archive must contain settings.gradle(.kts), app/build.gradle(.kts), "
                      "and app/src/main/AndroidManifest.xml."
                  )
              project_root = sorted(set(candidates), key=lambda path: (len(path.relative_to(destination).parts), str(path)))[0]
              source_mode = "repository ZIP"
              source_archive = archive.relative_to(workspace).as_posix()

              # The active repository workflow is authoritative. Copy it into the
              # extracted project so the source ZIP generated by CI contains the
              # workflow that performed the build, not an older embedded copy.
              active_workflow = workspace / ".github" / "workflows" / "build.yml"
              if not active_workflow.is_file():
                  active_workflow = workspace / ".github" / "workflows" / "main.yml"
              project_workflow = project_root / ".github" / "workflows" / "build.yml"
              if active_workflow.is_file() and active_workflow.resolve() != project_workflow.resolve():
                  project_workflow.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(active_workflow, project_workflow)

          relative = project_root.relative_to(workspace).as_posix()
          relative = "." if relative == "." else relative
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"dir={relative}\n")
              output.write(f"mode={source_mode}\n")
              output.write(f"archive={source_archive}\n")
          print(f"Source mode: {source_mode}")
          if source_archive:
              print(f"Input archive: {source_archive}")
          print(f"Android project root: {project_root}")
          print(f"Settings: {next(path for path in project_root.iterdir() if path.name in ('settings.gradle', 'settings.gradle.kts'))}")
          print(f"App module: {project_root / 'app'}")
          PY

      - name: Validate on-page translation JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/PageTranslation.js
          node scripts/test-page-translation.cjs
          node scripts/test-translation-retries.cjs

      - name: Validate Compose and Kotlin API contracts
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: python3 scripts/check-compose-contracts.py

      - name: Validate project and CI toolchain consistency
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: python3 scripts/validate-ci-config.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4.0.4
        with:
          # setup-android v4.0.4 supplies its supported modern command-line tools.
          # Do not pin an obsolete numeric build ID or request the removed legacy "tools" package.
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages required by dhyra
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo 'ERROR: Android SDK root was not exported by android-actions/setup-android.' >&2
            exit 1
          fi

          # Match the module's compileSdk release(37) { minorApiLevel = 1 }.
          # AGP 9.3 uses Build Tools 36.0.0 by default; install it explicitly so
          # packaging and the optional apksigner verification do not depend on
          # Gradle auto-downloading Build Tools during a later task.
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            'platforms;android-37.1' \
            'build-tools;36.0.0'
          test -s "$SDK_ROOT/platforms/android-37.1/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "Android SDK root: $SDK_ROOT"

      - name: Set up Gradle 9.5.1 and cache
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.5.1'
          cache-provider: basic
          validate-wrappers: false

      - name: Verify CI toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          gradle --version
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -s "$SDK_ROOT/platforms/android-37.1/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Generate and verify Gradle Wrapper in the real dhyra project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION='9.5.1'
          EXPECTED_GRADLE_SHA256='bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f'
          EXPECTED_WRAPPER_JAR_SHA256='497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7'

          # This command runs inside the extracted dhyra root, which already has
          # settings.gradle.kts and build.gradle.kts. Never bootstrap in an empty
          # temporary directory: the actual root build pins Gradle and its checksum.
          test -s settings.gradle.kts -o -s settings.gradle
          test -s build.gradle.kts -o -s build.gradle
          test -s app/build.gradle.kts -o -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml

          INSTALLED_GRADLE_VERSION="$(gradle --version | sed -n 's/^Gradle //p' | head -n 1)"
          if [[ "$INSTALLED_GRADLE_VERSION" != "$GRADLE_VERSION" ]]; then
            echo "ERROR: Expected Gradle $GRADLE_VERSION from setup-gradle, got $INSTALLED_GRADLE_VERSION." >&2
            exit 1
          fi

          # Generate the wrapper in this actual Android project root. Explicit
          # CLI arguments keep the version/type/checksum aligned even if the
          # wrapper task configuration is edited later.
          gradle --no-daemon --stacktrace wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin \
            --gradle-distribution-sha256-sum "$EXPECTED_GRADLE_SHA256"

          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradlew
          test -s gradlew.bat
          chmod 0755 gradlew

          ACTUAL_WRAPPER_JAR_SHA256="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [[ "$ACTUAL_WRAPPER_JAR_SHA256" != "$EXPECTED_WRAPPER_JAR_SHA256" ]]; then
            echo 'ERROR: Generated Gradle Wrapper JAR checksum does not match Gradle 9.5.1 official checksum.' >&2
            echo "Expected: $EXPECTED_WRAPPER_JAR_SHA256" >&2
            echo "Actual:   $ACTUAL_WRAPPER_JAR_SHA256" >&2
            exit 1
          fi

          # Increase the wrapper download timeout while retaining the pinned checksum.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle/wrapper/gradle-wrapper.properties')
          text = path.read_text(encoding='utf-8')
          expected = 'distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f'
          if expected not in text:
              raise SystemExit('Gradle Wrapper distribution checksum does not match the pinned Gradle 9.5.1 checksum.')
          lines = [line for line in text.splitlines() if not line.startswith('networkTimeout=')]
          lines.append('networkTimeout=60000')
          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          grep -Fq 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fq "distributionSha256Sum=$EXPECTED_GRADLE_SHA256" gradle/wrapper/gradle-wrapper.properties
          test -x ./gradlew
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = "$EXPECTED_WRAPPER_JAR_SHA256"
          ./gradlew --no-daemon --version

      - name: Validate Gradle project configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace help

      - name: Verify Android AAR metadata compatibility
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:checkDebugAarMetadata

      - name: Compile debug Kotlin sources
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Compile Kotlin unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugUnitTestKotlin

      - name: Run JVM unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compile Macrobenchmark instrumentation APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :benchmark:assembleBenchmark

      - name: Run Android lint
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build unsigned release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && !inputs.sign_release }}
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          # No signing secrets are exposed to an unsigned release build.
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Build signed release APK and App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.sign_release }}
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          DHYRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DHYRA_RELEASE_KEYSTORE_BASE64 }}
          DHYRA_RELEASE_STORE_PASSWORD: ${{ secrets.DHYRA_RELEASE_STORE_PASSWORD }}
          DHYRA_RELEASE_KEY_ALIAS: ${{ secrets.DHYRA_RELEASE_KEY_ALIAS }}
          DHYRA_RELEASE_KEY_PASSWORD: ${{ secrets.DHYRA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/dhyra-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          export DHYRA_RELEASE_STORE_FILE="$SIGNING_DIR/release.jks"
          printf '%s' "$DHYRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$DHYRA_RELEASE_STORE_FILE"
          chmod 600 "$DHYRA_RELEASE_STORE_FILE"
          test -s "$DHYRA_RELEASE_STORE_FILE"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Validate and stage APK outputs
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          BUILD_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
          SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
        run: |
          set -euo pipefail
          # Always start with a clean artifact staging directory. This prevents
          # a tracked/pre-existing dist/ folder from contributing stale APKs.
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          case "$DIST_DIR" in
            "$GITHUB_WORKSPACE/dist") ;;
            *) echo 'ERROR: Refusing to clean an unexpected artifact directory.' >&2; exit 1 ;;
          esac
          rm -rf -- "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0.apk"
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            if [[ "$SIGN_RELEASE" == "true" ]]; then
              RELEASE_APK='app/build/outputs/apk/release/app-release.apk'
              RELEASE_AAB='app/build/outputs/bundle/release/app-release.aab'
              test -s "$RELEASE_APK"
              test -s "$RELEASE_AAB"
              cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0-release.apk"
              cp "$RELEASE_AAB" "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0-release.aab"
            else
              RELEASE_APK='app/build/outputs/apk/release/app-release-unsigned.apk'
              test -s "$RELEASE_APK"
              cp "$RELEASE_APK" "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0-release-unsigned.apk"
            fi
          fi
          python3 - "$GITHUB_WORKSPACE/dist" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          output = Path(sys.argv[1])
          apks = sorted(output.glob('*.apk'))
          if not apks:
              raise SystemExit('No APK was staged.')
          for apk in apks:
              if apk.stat().st_size < 100_000:
                  raise SystemExit(f"APK is unexpectedly small: {apk.stat().st_size} bytes")
              with ZipFile(apk) as archive:
                  names = set(archive.namelist())
                  if "AndroidManifest.xml" not in names:
                      raise SystemExit(f"{apk.name} has no AndroidManifest.xml")
                  if not any(name == "classes.dex" or (name.startswith("classes") and name.endswith(".dex")) for name in names):
                      raise SystemExit(f"{apk.name} has no DEX bytecode")
                  corrupt = archive.testzip()
                  if corrupt:
                      raise SystemExit(f"Corrupt APK entry in {apk.name}: {corrupt}")
              print(f"APK verified: {apk} ({apk.stat().st_size} bytes)")
          PY
          if [[ "$SIGN_RELEASE" == "true" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0-release.apk"
            jarsigner -verify -certs "$GITHUB_WORKSPACE/dist/dhyra-v2.6.0-release.aab"
          fi

      - name: Create and validate clean source ZIP
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          project = (workspace / os.environ["PROJECT_DIR"]).resolve()
          output_dir = workspace / "dist"
          output_dir.mkdir(parents=True, exist_ok=True)
          archive_path = output_dir / "dhyra-source.zip"
          excluded_dirs = {
              ".git", ".gradle", ".idea", ".kotlin", ".cxx", ".externalNativeBuild",
              "build", "dist", "captures", "tmp", "node_modules", ".ci-dhyra-unpacked"
          }
          excluded_names = {
              "local.properties", ".DS_Store", "Thumbs.db", "keystore.properties",
              "signing.properties", "credentials.properties", "dhyra-source.zip"
          }
          excluded_suffixes = {
              ".jks", ".keystore", ".apk", ".aab", ".log", ".pem", ".p12", ".zip",
              ".pfx", ".key", ".p8"
          }
          with ZipFile(archive_path, "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(project.rglob("*")):
                  if not path.is_file() or path.is_symlink():
                      continue
                  relative = path.relative_to(project)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.name in excluded_names or path.suffix.lower() in excluded_suffixes:
                      continue
                  if path.name.startswith(".env") or "secret" in path.name.lower():
                      continue
                  archive.write(path, relative.as_posix())

          with ZipFile(archive_path) as archive:
              names = set(archive.namelist())
              required = {
                  "settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts",
                  "app/src/main/AndroidManifest.xml", "gradle/wrapper/gradle-wrapper.jar",
                  "gradle/wrapper/gradle-wrapper.properties", "gradlew", "gradlew.bat"
              }
              missing = required - names
              has_workflow = any(name in names for name in (
                  ".github/workflows/build.yml", ".github/workflows/main.yml"
              ))
              if missing:
                  raise SystemExit("Source ZIP missing required files: " + ", ".join(sorted(missing)))
              if not has_workflow:
                  raise SystemExit("Source ZIP is missing .github/workflows/build.yml or main.yml")
              wrapper_info = archive.getinfo("gradle/wrapper/gradle-wrapper.jar")
              if wrapper_info.file_size < 10_000:
                  raise SystemExit("Gradle Wrapper JAR is unexpectedly small.")
              corrupt = archive.testzip()
              if corrupt:
                  raise SystemExit(f"Corrupt source ZIP entry: {corrupt}")
          print(f"Source archive verified: {archive_path} ({archive_path.stat().st_size} bytes)")
          print(f"Archived project root: {project}")
          PY

      - name: Create and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload verified APK, source ZIP and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dhyra-v2.6.0-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle diagnostics if build fails
        if: failure() && steps.project.outputs.dir != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dhyra-build-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7


  macrobenchmark:
    name: Macrobenchmark on a connected physical Android device
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macrobenchmark }}
    needs: build
    # Requires runner >= 2.327.1 (Node 24 actions) and one unlocked physical Android 14+ device.
    runs-on: [self-hosted, linux, android-physical]
    timeout-minutes: 60
    steps:
      - name: Download the exact source archive produced by the build job
        uses: actions/download-artifact@v8.0.2
        with:
          name: dhyra-v2.6.0-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dhyra-build-artifact

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install project Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Verify a physical Android 14+ device is connected
        shell: bash
        run: |
          set -euo pipefail
          adb start-server
          adb devices -l
          DEVICE_COUNT="$(adb devices | awk 'NR>1 && $2=="device" {count++} END {print count+0}')"
          if [[ "$DEVICE_COUNT" != "1" ]]; then
            echo "ERROR: Exactly one authorized physical Android device must be connected; found $DEVICE_COUNT." >&2
            exit 1
          fi
          SDK_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          IS_EMULATOR="$(adb shell getprop ro.kernel.qemu | tr -d '\r')"
          if [[ "$SDK_LEVEL" -lt 34 || "$IS_EMULATOR" == "1" ]]; then
            echo "ERROR: Macrobenchmark requires a physical Android 14+ device (API 34+). SDK=$SDK_LEVEL emulator=$IS_EMULATOR" >&2
            exit 1
          fi
          echo "Connected physical Android API $SDK_LEVEL device."

      - name: Extract verified source ZIP in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ runner.temp }}/dhyra-build-artifact/dhyra-source.zip" "${{ runner.temp }}/dhyra-project" <<'PY'
          import shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive_path, target = Path(sys.argv[1]), Path(sys.argv[2])
          if not archive_path.is_file():
              raise SystemExit('dhyra-source.zip is missing from build artifact')
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive_path) as archive:
              entries = archive.infolist()
              if sum(e.file_size for e in entries) > 600 * 1024 * 1024:
                  raise SystemExit('source archive exceeds 600 MiB expanded limit')
              seen = set()
              for entry in entries:
                  name = entry.filename
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or '..' in path.parts or '\\' in name or name in seen:
                      raise SystemExit(f'unsafe or duplicate ZIP member: {name!r}')
                  seen.add(name)
                  mode = (entry.external_attr >> 16) & 0xffff
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink not allowed: {name!r}')
                  output = (target / Path(*path.parts)).resolve()
                  if not output.is_relative_to(target.resolve()):
                      raise SystemExit(f'ZIP path escapes destination: {name!r}')
              corrupt = archive.testzip()
              if corrupt:
                  raise SystemExit(f'ZIP integrity failure at {corrupt}')
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  output = target / Path(*path.parts)
                  if entry.is_dir():
                      output.mkdir(parents=True, exist_ok=True)
                  else:
                      output.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as src, output.open('wb') as dst:
                          shutil.copyfileobj(src, dst)
          for required in ('settings.gradle.kts', 'app/build.gradle.kts', 'benchmark/build.gradle.kts', 'gradlew'):
              if not (target / required).is_file():
                  raise SystemExit(f'required file missing: {required}')
          print(f'Extracted benchmark project into {target}')
          PY
          chmod 0755 "${{ runner.temp }}/dhyra-project/gradlew"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.5.1'
          cache-provider: basic
          validate-wrappers: true

      - name: Run benchmark variant on the connected device
        working-directory: ${{ runner.temp }}/dhyra-project
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :benchmark:connectedBenchmarkAndroidTest

      - name: Upload physical-device benchmark reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dhyra-v2.6.0-physical-macrobenchmark-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dhyra-project/benchmark/build/reports/
            ${{ runner.temp }}/dhyra-project/benchmark/build/outputs/connected_android_test_additional_output/
            ${{ runner.temp }}/dhyra-project/benchmark/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
