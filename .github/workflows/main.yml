name: DHYRA BROWSER - Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Detect Project and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DETECT AND SELECT ANDROID PROJECT
      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/dhyra-extracted"
          mkdir -p "$EXTRACT_ROOT"

          PROJECTS=()
          ZIP_PROJECTS=()

          is_android_project() {
            local dir="$1"

            [[ -f "$dir/gradlew" ]] &&
            [[ -f "$dir/gradle/wrapper/gradle-wrapper.jar" ]] &&
            [[ -f "$dir/gradle/wrapper/gradle-wrapper.properties" ]] &&
            [[ -f "$dir/app/src/main/AndroidManifest.xml" ]] &&
            {
              [[ -f "$dir/settings.gradle" ]] ||
              [[ -f "$dir/settings.gradle.kts" ]]
            } &&
            {
              [[ -f "$dir/app/build.gradle" ]] ||
              [[ -f "$dir/app/build.gradle.kts" ]]
            }
          }

          discover_projects() {
            local root="$1"
            local wrapper
            local project_dir

            while IFS= read -r -d '' wrapper; do
              project_dir="$(dirname "$wrapper")"

              if is_android_project "$project_dir"; then
                printf '%s\n' "$project_dir"
              fi
            done < <(
              find "$root" \
                -type f \
                -name gradlew \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print0
            )
          }

          # Search the repository first.
          mapfile -t PROJECTS < <(
            discover_projects "$GITHUB_WORKSPACE" | sort -u
          )

          # If no complete project is in the repository, search ZIP archives.
          if [[ ${#PROJECTS[@]} -eq 0 ]]; then
            echo "No complete Android project found in the repository."
            echo "Searching source ZIP archives..."

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 8 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print |
              sort
            )

            if [[ ${#ZIP_FILES[@]} -eq 0 ]]; then
              echo "::error::No Android project or ZIP archive found."
              echo "::error::A valid project must include gradlew, the Gradle wrapper files, settings, app Gradle file, and AndroidManifest.xml."
              exit 1
            fi

            ZIP_INDEX=0

            for ZIP_FILE in "${ZIP_FILES[@]}"; do
              ZIP_DEST="$EXTRACT_ROOT/archive-$ZIP_INDEX"
              ZIP_INDEX=$((ZIP_INDEX + 1))

              mkdir -p "$ZIP_DEST"

              echo "Extracting: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$ZIP_DEST"

              mapfile -t FOUND < <(
                discover_projects "$ZIP_DEST" | sort -u
              )

              for PROJECT in "${FOUND[@]}"; do
                ZIP_PROJECTS+=("$PROJECT")
              done
            done

            PROJECTS=()
            for PROJECT in "${ZIP_PROJECTS[@]}"; do
              PROJECTS+=("$PROJECT")
            done
          fi

          # Remove duplicate paths.
          if [[ ${#PROJECTS[@]} -gt 0 ]]; then
            mapfile -t PROJECTS < <(
              printf '%s\n' "${PROJECTS[@]}" |
              sed '/^$/d' |
              sort -u
            )
          fi

          if [[ ${#PROJECTS[@]} -eq 0 ]]; then
            echo "::error::No complete Android project detected."
            echo "::error::Check that the project contains:"
            echo "::error::  gradlew"
            echo "::error::  gradle/wrapper/gradle-wrapper.jar"
            echo "::error::  gradle/wrapper/gradle-wrapper.properties"
            echo "::error::  settings.gradle or settings.gradle.kts"
            echo "::error::  app/build.gradle or app/build.gradle.kts"
            echo "::error::  app/src/main/AndroidManifest.xml"
            exit 1
          fi

          # Select the best candidate. Candidates already have all required files.
          BEST_PROJECT=""
          BEST_SCORE=-1
          BEST_LENGTH=999999

          for PROJECT in "${PROJECTS[@]}"; do
            SCORE=0

            [[ -f "$PROJECT/gradlew" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle/wrapper/gradle-wrapper.jar" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle.properties" ]] && SCORE=$((SCORE + 5))
            [[ -f "$PROJECT/app/src/main/AndroidManifest.xml" ]] && SCORE=$((SCORE + 20))
            [[ -f "$PROJECT/app/build.gradle" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/app/build.gradle.kts" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/build.gradle" ]] && SCORE=$((SCORE + 5))
            [[ -f "$PROJECT/build.gradle.kts" ]] && SCORE=$((SCORE + 5))

            LENGTH=${#PROJECT}

            echo "Project candidate: $PROJECT"
            echo "Project score: $SCORE"

            if [[ "$SCORE" -gt "$BEST_SCORE" ]] ||
               {
                 [[ "$SCORE" -eq "$BEST_SCORE" ]] &&
                 [[ "$LENGTH" -lt "$BEST_LENGTH" ]]
               }; then
              BEST_PROJECT="$PROJECT"
              BEST_SCORE="$SCORE"
              BEST_LENGTH="$LENGTH"
            fi
          done

          if [[ -z "$BEST_PROJECT" ]]; then
            echo "::error::Unable to select an Android project."
            exit 1
          fi

          echo "dir=$BEST_PROJECT" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "ANDROID PROJECT SELECTED"
          echo "$BEST_PROJECT"
          echo "Candidates: ${#PROJECTS[@]}"
          echo "Score: $BEST_SCORE"
          echo "======================================"

      # 2. JAVA 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. ANDROID SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 4. GRADLE SETUP
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # 5. VALIDATE PROJECT
      - name: Validate Android Project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_FILES=(
            "gradlew"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required project file is missing: $FILE"
              exit 1
            fi
          done

          if [[ ! -f settings.gradle ]] &&
             [[ ! -f settings.gradle.kts ]]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [[ ! -f app/build.gradle ]] &&
             [[ ! -f app/build.gradle.kts ]]; then
            echo "::error::App Gradle file is missing."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Project validation passed."
          ./gradlew --version

      # 6. OPTIONAL CORE LOGIC CHECK
      - name: Run Core Logic Check
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TASKS_OUTPUT="$(./gradlew --no-daemon tasks --all)"

          if grep -q 'verifyCoreLogic' <<< "$TASKS_OUTPUT"; then
            echo "Running verifyCoreLogic..."
            ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic
          else
            echo "verifyCoreLogic task not found."
            echo "Skipping optional check."
          fi

      # 7. ANDROID LINT
      - name: Android Lint
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      # 8. BUILD APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # 9. VERIFY APK
      - name: Verify APK Output
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::APK output directory was not created: $APK_DIR"
            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [[ -z "$APK" ]] || [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESS"
          ls -lh "$APK"

      # 10. UPLOAD APK
      - name: Upload DHYRA Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 11. UPLOAD DIAGNOSTIC REPORTS
      - name: Upload Build Reports
        if: always() && steps.project.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-BUILD-REPORTS
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
