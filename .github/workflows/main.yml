name: DHYRA Browser Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the unsigned release APK as an additional artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7 and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Generate standard Gradle wrapper
        run: gradle --no-daemon --stacktrace wrapper --gradle-version 8.7 --distribution-type bin

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename distributable debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro
          path: app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Optional unsigned release APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Generate standard Gradle wrapper
        run: gradle --no-daemon --stacktrace wrapper --gradle-version 8.7 --distribution-type bin

      - name: Assemble unsigned release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
