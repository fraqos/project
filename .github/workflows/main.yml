name: DHYRA Browser - Build from ZIP

on:
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build an additional unsigned release APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhyra-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (ZIP only is required for source)
        uses: actions/checkout@v4

      - name: Extract project ZIP and locate Gradle root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          destination = workspace / ".ci-dhyra-unpacked"

          # Expect exactly one project ZIP in the repository root.
          archives = sorted(
              p for p in workspace.iterdir()
              if p.is_file() and p.suffix.lower() == ".zip"
          )
          if not archives:
              sys.exit(
                  "ERROR: No .zip file found at repository root. "
                  "Upload the DHYRA project ZIP to the repository root."
              )
          if len(archives) > 1:
              names = ", ".join(p.name for p in archives)
              sys.exit(
                  "ERROR: More than one root-level ZIP was found: " + names +
                  ". Keep only the DHYRA project ZIP in the repository root."
              )

          archive = archives[0]
          print(f"Project archive: {archive.name}")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)

          # Extract safely: reject absolute paths and parent-directory traversal.
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  member = PurePosixPath(item.filename)
                  if member.is_absolute() or ".." in member.parts:
                      sys.exit(f"ERROR: Unsafe ZIP entry: {item.filename}")
                  if not member.parts:
                      continue
                  target = destination.joinpath(*member.parts).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      sys.exit(f"ERROR: ZIP entry escapes extraction folder: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(item) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)

          # A valid project root must have both a settings file and app Gradle file.
          candidates = []
          for settings in destination.rglob("settings.gradle*"):
              if settings.name not in ("settings.gradle", "settings.gradle.kts"):
                  continue
              root = settings.parent
              app_gradle = root / "app" / "build.gradle.kts"
              app_gradle_groovy = root / "app" / "build.gradle"
              if app_gradle.is_file() or app_gradle_groovy.is_file():
                  candidates.append(root)

          # Prefer the shallowest matching project root.
          candidates = sorted(set(candidates), key=lambda p: (len(p.relative_to(destination).parts), str(p)))
          if not candidates:
              sys.exit(
                  "ERROR: The ZIP was extracted, but no Android Gradle project was found. "
                  "The archive must contain settings.gradle(.kts) and app/build.gradle(.kts)."
              )

          project_root = candidates[0]
          relative_root = project_root.relative_to(workspace)
          output_file = Path(os.environ["GITHUB_OUTPUT"])
          with output_file.open("a", encoding="utf-8") as handle:
              handle.write(f"dir={relative_root.as_posix()}\n")
              handle.write(f"archive={archive.name}\n")

          print(f"Gradle project root: {project_root}")
          print(f"Settings file: {next(p for p in project_root.iterdir() if p.name in ('settings.gradle', 'settings.gradle.kts'))}")
          print(f"App Gradle file present: {(project_root / 'app').is_dir()}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7 and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      # The uploaded ZIP may omit gradle-wrapper.jar. Generate a complete wrapper
      # using the installed Gradle distribution before calling ./gradlew.
      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace wrapper \
            --gradle-version 8.7 \
            --distribution-type bin
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew --no-daemon --version

      - name: Run JVM unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" "app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-Browser-v2.0-Pro
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build optional unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload optional unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-Browser-v2.0-Pro-release-unsigned
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-Browser-build-reports
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
