
name: DHYRA BROWSER - Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Detect Project and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # 1. DETECT AND SELECT ANDROID PROJECT
      # ==================================================
      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/dhyra-extracted"
          mkdir -p "$EXTRACT_ROOT"

          declare -a PROJECTS=()
          declare -a ZIP_PROJECTS=()

          is_android_project() {
            local dir="$1"

            [[ -f "$dir/gradlew" ]] &&
            [[ -f "$dir/app/src/main/AndroidManifest.xml" ]] &&
            { [[ -f "$dir/settings.gradle" ]] ||
              [[ -f "$dir/settings.gradle.kts" ]]; } &&
            { [[ -f "$dir/app/build.gradle" ]] ||
              [[ -f "$dir/app/build.gradle.kts" ]]; }
          }

          discover_projects() {
            local root="$1"
            local wrapper

            while IFS= read -r -d '' wrapper; do
              local project_dir
              project_dir="$(dirname "$wrapper")"

              if is_android_project "$project_dir"; then
                printf '%s\n' "$project_dir"
              fi
            done < <(
              find "$root" \
                -type f \
                -name gradlew \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print0
            )
          }

          # Search the repository first.
          mapfile -t PROJECTS < <(
            discover_projects "$GITHUB_WORKSPACE" |
            sort -u
          )

          # ZIP fallback if no complete project is found.
          if [[ ${#PROJECTS[@]} -eq 0 ]]; then
            echo "No complete Android project found in repository."
            echo "Searching source ZIP archives..."

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 8 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -print |
              sort
            )

            if [[ ${#ZIP_FILES[@]} -eq 0 ]]; then
              echo "::error::No Android project or source ZIP found."
              exit 1
            fi

            for ZIP_FILE in "${ZIP_FILES[@]}"; do
              echo "Extracting: $ZIP_FILE"

              ZIP_NAME="$(basename "$ZIP_FILE" .zip)"
              ZIP_DEST="$EXTRACT_ROOT/$ZIP_NAME"

              mkdir -p "$ZIP_DEST"

              unzip -oq "$ZIP_FILE" -d "$ZIP_DEST"

              mapfile -t FOUND < <(
                discover_projects "$ZIP_DEST" |
                sort -u
              )

              for PROJECT in "${FOUND[@]}"; do
                ZIP_PROJECTS+=("$PROJECT")
              done
            done

            PROJECTS=("${ZIP_PROJECTS[@]}")
          fi

          # Remove duplicate candidates.
          mapfile -t PROJECTS < <(
            printf '%s\n' "${PROJECTS[@]}" |
            sed '/^$/d' |
            sort -u
          )

          if [[ ${#PROJECTS[@]} -eq 0 ]]; then
            echo "::error::No valid Android project detected."
            echo "Required files:"
            echo " - gradlew"
            echo " - settings.gradle or settings.gradle.kts"
            echo " - app/build.gradle or app/build.gradle.kts"
            echo " - app/src/main/AndroidManifest.xml"
            exit 1
          fi

          # ==================================================
          # 2. SELECT THE MOST COMPLETE PROJECT
          # ==================================================

          BEST_PROJECT=""
          BEST_SCORE=-1
          BEST_LENGTH=999999

          for PROJECT in "${PROJECTS[@]}"; do
            SCORE=0

            [[ -f "$PROJECT/gradlew" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle/wrapper/gradle-wrapper.jar" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/gradle.properties" ]] && SCORE=$((SCORE + 5))
            [[ -f "$PROJECT/app/src/main/AndroidManifest.xml" ]] && SCORE=$((SCORE + 20))
            [[ -f "$PROJECT/app/build.gradle" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/app/build.gradle.kts" ]] && SCORE=$((SCORE + 10))
            [[ -f "$PROJECT/build.gradle" ]] && SCORE=$((SCORE + 5))
            [[ -f "$PROJECT/build.gradle.kts" ]] && SCORE=$((SCORE + 5))

            LENGTH=${#PROJECT}

            echo "Candidate: $PROJECT"
            echo "Score: $SCORE"

            if [[ "$SCORE" -gt "$BEST_SCORE" ]] ||
               { [[ "$SCORE" -eq "$BEST_SCORE" ]] &&
                 [[ "$LENGTH" -lt "$BEST_LENGTH" ]]; }; then

              BEST_PROJECT="$PROJECT"
              BEST_SCORE="$SCORE"
              BEST_LENGTH="$LENGTH"
            fi
          done

          if [[ -z "$BEST_PROJECT" ]]; then
            echo "::error::Unable to select Android project."
            exit 1
          fi

          echo "dir=$BEST_PROJECT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "ANDROID PROJECT SELECTED"
          echo "$BEST_PROJECT"
          echo "Score: $BEST_SCORE"
          echo "Candidates: ${#PROJECTS[@]}"
          echo "=========================================="

      # ==================================================
      # 3. JAVA
      # ==================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==================================================
      # 4. ANDROID SDK
      # ==================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==================================================
      # 5. GRADLE CACHE
      # ==================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ==================================================
      # 6. VALIDATE PROJECT
      # ==================================================
      - name: Validate Android Project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          echo "Checking Android project files..."

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/AndroidManifest.xml

          if [[ ! -f settings.gradle ]] &&
             [[ ! -f settings.gradle.kts ]]; then
            echo "::error::Gradle settings file missing."
            exit 1
          fi

          if [[ ! -f app/build.gradle ]] &&
             [[ ! -f app/build.gradle.kts ]]; then
            echo "::error::App Gradle file missing."
            exit 1
          fi

          echo "Project validation passed."

          ./gradlew --version

      # ==================================================
      # 7. OPTIONAL CORE LOGIC CHECK
      # ==================================================
      - name: Run Core Logic Check
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TASKS_OUTPUT="$(./gradlew --no-daemon tasks --all)"

          if grep -q 'verifyCoreLogic' <<< "$TASKS_OUTPUT"; then
            echo "Running verifyCoreLogic task..."
            ./gradlew --no-daemon --stacktrace :app:verifyCoreLogic
          else
            echo "verifyCoreLogic task not present."
            echo "Skipping optional task."
          fi

      # ==================================================
      # 8. LINT
      # ==================================================
      - name: Android Lint
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      # ==================================================
      # 9. BUILD APK
      # ==================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # ==================================================
      # 10. VERIFY APK
      # ==================================================
      - name: Verify APK Output
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          if [[ -z "$APK" ]] || [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"

      # ==================================================
      # 11. UPLOAD APK
      # ==================================================
      - name: Upload DHYRA Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-v1.4.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # 12. UPLOAD BUILD REPORTS
      # ==================================================
      - name: Upload Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DHYRA-BROWSER-BUILD-REPORTS
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
