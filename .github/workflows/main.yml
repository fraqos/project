name: DHYRA Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Also build an unsigned release APK
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, build and package DHYRA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7.0.1

      - name: Verify Android project is committed at repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || {
            echo 'ERROR: settings.gradle.kts is missing from repository root.' >&2
            echo 'One-time setup: extract DHYRA-FINAL.zip and commit its CONTENTS to the repository root.' >&2
            exit 1
          }
          test -f app/build.gradle.kts || {
            echo 'ERROR: app/build.gradle.kts is missing. The Android project must be at repository root.' >&2
            exit 1
          }
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.properties
          echo 'Root Gradle project verified.'

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install project Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13 and cache
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Generate standard Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --no-daemon --version

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Optional unsigned release build
        if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage optional unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/DHYRA-Browser-v2.0-Pro-release-unsigned.apk

      - name: Validate and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/DHYRA-Browser-v2.0-Pro.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('dist/DHYRA-Browser-v2.0-Pro.apk')
          if apk.stat().st_size < 100_000:
              raise SystemExit(f'APK is unexpectedly small: {apk.stat().st_size} bytes')
          with ZipFile(apk) as z:
              names = set(z.namelist())
              if 'AndroidManifest.xml' not in names or not any(n.startswith('classes') and n.endswith('.dex') for n in names):
                  raise SystemExit('APK archive is missing AndroidManifest.xml or DEX bytecode')
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt APK member: {bad}')
          print(f'Validated APK: {apk} ({apk.stat().st_size} bytes)')
          PY

      - name: Create clean source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('.').resolve()
          archive = root / 'dist' / 'DHYRA-FINAL.zip'
          excluded_dirs = {'.git', '.gradle', '.idea', '.kotlin', '.cxx', '.externalNativeBuild', 'build', 'dist', 'captures', 'tmp', 'node_modules'}
          excluded_names = {'local.properties', '.DS_Store', 'Thumbs.db', 'keystore.properties', 'signing.properties', 'credentials.properties'}
          excluded_suffixes = {'.jks', '.keystore', '.apk', '.aab', '.log', '.pem', '.p12', '.pfx', '.key', '.p8'}
          with ZipFile(archive, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.is_symlink():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if path.name in excluded_names or path.suffix.lower() in excluded_suffixes:
                      continue
                  if path.name.startswith('.env') or 'secret' in path.name.lower():
                      continue
                  z.write(path, rel.as_posix())
          with ZipFile(archive) as z:
              names = set(z.namelist())
              required = {'settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'app/src/main/AndroidManifest.xml', '.github/workflows/build.yml', 'gradle/wrapper/gradle-wrapper.jar', 'gradle/wrapper/gradle-wrapper.properties', 'gradlew', 'gradlew.bat'}
              missing = required - names
              if missing:
                  raise SystemExit('Source ZIP missing required project files: ' + ', '.join(sorted(missing)))
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt source ZIP member: {bad}')
          print(f'Created and validated {archive} ({archive.stat().st_size} bytes)')
          PY

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload verified outputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: DHYRA-FINAL-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: DHYRA-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

