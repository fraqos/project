name: DHYRA Browser Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the unsigned release APK as an additional artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Supports both layouts:
      # 1) Gradle files at repository root
      # 2) Gradle project inside a directory (for example DHYRA_Browser_v2.0_Pro/)
      - name: Locate Gradle project root
        id: project-root
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            project_dir="."
          else
            settings_file="$(find . -mindepth 2 -maxdepth 6 -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.git/*' -not -path '*/.gradle/*' \
              -print -quit)"

            if [[ -z "${settings_file}" ]]; then
              echo "ERROR: No settings.gradle(.kts) found in the repository." >&2
              echo "Commit the contents of the DHYRA project, or keep the project in a subfolder." >&2
              exit 1
            fi
            project_dir="$(dirname "${settings_file}")"
          fi

          if [[ ! -f "${project_dir}/app/build.gradle.kts" && ! -f "${project_dir}/app/build.gradle" ]]; then
            echo "ERROR: ${project_dir} is not an Android app project (app/build.gradle(.kts) missing)." >&2
            exit 1
          fi

          echo "dir=${project_dir}" >> "${GITHUB_OUTPUT}"
          echo "Gradle project root: ${project_dir}"
          ls -la "${project_dir}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7 and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      # The source archive intentionally does not need to carry gradle-wrapper.jar.
      # Generate a standard wrapper from the detected project root before invoking it.
      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: gradle --no-daemon --stacktrace wrapper --gradle-version 8.7 --distribution-type bin

      - name: Run JVM unit tests
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename distributable debug APK
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro
          path: ${{ steps.project-root.outputs.dir }}/app/build/outputs/apk/debug/DHYRA-Browser-v2.0-Pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro-build-reports
          path: |
            ${{ steps.project-root.outputs.dir }}/app/build/reports/
            ${{ steps.project-root.outputs.dir }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Optional unsigned release APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Gradle project root
        id: project-root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            project_dir="."
          else
            settings_file="$(find . -mindepth 2 -maxdepth 6 -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.git/*' -not -path '*/.gradle/*' \
              -print -quit)"
            if [[ -z "${settings_file}" ]]; then
              echo "ERROR: No settings.gradle(.kts) found in the repository." >&2
              exit 1
            fi
            project_dir="$(dirname "${settings_file}")"
          fi
          if [[ ! -f "${project_dir}/app/build.gradle.kts" && ! -f "${project_dir}/app/build.gradle" ]]; then
            echo "ERROR: ${project_dir}/app/build.gradle(.kts) missing." >&2
            exit 1
          fi
          echo "dir=${project_dir}" >> "${GITHUB_OUTPUT}"
          echo "Gradle project root: ${project_dir}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: gradle --no-daemon --stacktrace wrapper --gradle-version 8.7 --distribution-type bin

      - name: Assemble unsigned release APK
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: DHYRA-Browser-v2.0-Pro-release-unsigned
          path: ${{ steps.project-root.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
