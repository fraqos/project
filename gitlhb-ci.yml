image: openjdk:17-jdk

stages:
  - build

build_apk:
  stage: build
  before_script:
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget tar unzip lib32stdc++6 lib32z1
    - unzip -q DHYRA-BROWSER-GitHub-Ready.zip -d proyek_ekstrak
    - cd proyek_ekstrak && if [ -f "gradlew" ]; then true; else cd *; fi
    - wget --output-document=android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - mkdir -p $PWD/android-sdk/cmdline-tools
    - unzip -q android-sdk.zip -d $PWD/android-sdk/cmdline-tools
    - mv $PWD/android-sdk/cmdline-tools/cmdline-tools $PWD/android-sdk/cmdline-tools/latest
    - export ANDROID_HOME=$PWD/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses
    - sdkmanager "platforms;android-34" "build-tools;34.0.0"
    - chmod +x ./gradlew
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - "**/build/outputs/apk/debug/*.apk"
    expire_in: 30 days
